<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a" />
      <stop offset="45%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00bbf9" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="nodeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="nodeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <linearGradient id="nodeGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <linearGradient id="nodeGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-subtle" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Dynamic CSS Styles & Animations -->
    <style>
      @keyframes pulseNode {
        0%, 100% { r: 18; opacity: 0.9; }
        50% { r: 24; opacity: 1; filter: drop-shadow(0 0 12px #38bdf8); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -120; }
      }
      @keyframes floatEffect {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes glowPulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.7; }
      }
      .node-pulse-1 { animation: pulseNode 3s ease-in-out infinite; }
      .node-pulse-2 { animation: pulseNode 3s ease-in-out infinite 0.75s; }
      .node-pulse-3 { animation: pulseNode 3s ease-in-out infinite 1.5s; }
      .node-pulse-4 { animation: pulseNode 3s ease-in-out infinite 2.25s; }
      .stream-line { stroke-dasharray: 8, 8; animation: dashFlow 3s linear infinite; }
      .floating-banner { animation: floatEffect 5s ease-in-out infinite; }
      .bg-glow { animation: glowPulse 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Background Decorative Grid & Geometry -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="180" r="140" fill="#0284c7" opacity="0.15" filter="url(#glow)" class="bg-glow" />
  <circle cx="1000" cy="180" r="150" fill="#9333ea" opacity="0.15" filter="url(#glow)" class="bg-glow" />

  <!-- Floating Vector / Graph Pipeline Graphic (Right Side) -->
  <g transform="translate(680, 40)" class="floating-banner">
    <!-- Connecting Circuit Streamlines -->
    <path d="M 50 140 C 120 70, 180 80, 240 140 C 300 200, 360 210, 430 140" fill="none" stroke="#38bdf8" stroke-width="2.5" class="stream-line" opacity="0.8" />
    <path d="M 50 140 C 140 220, 200 210, 240 140 C 280 70, 350 80, 430 140" fill="none" stroke="#c084fc" stroke-width="2" class="stream-line" opacity="0.6" style="animation-duration: 4s;" />
    
    <!-- Secondary Branch Connections -->
    <line x1="240" y1="140" x2="240" y2="40" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.7" />
    <line x1="240" y1="140" x2="240" y2="240" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.7" />
    <line x1="140" y1="90" x2="340" y2="190" stroke="#38bdf8" stroke-width="1" opacity="0.4" />
    <line x1="140" y1="190" x2="340" y2="90" stroke="#f472b6" stroke-width="1" opacity="0.4" />

    <!-- Sub Nodes -->
    <circle cx="240" cy="40" r="10" fill="url(#nodeGrad2)" opacity="0.8" />
    <circle cx="240" cy="240" r="10" fill="url(#nodeGrad4)" opacity="0.8" />
    <circle cx="140" cy="90" r="8" fill="#38bdf8" opacity="0.7" />
    <circle cx="140" cy="190" r="8" fill="#818cf8" opacity="0.7" />
    <circle cx="340" cy="90" r="8" fill="#c084fc" opacity="0.7" />
    <circle cx="340" cy="190" r="8" fill="#f472b6" opacity="0.7" />

    <!-- Primary Pipeline Nodes -->
    <!-- Node 1: Ingest & Parse -->
    <g transform="translate(50, 140)">
      <circle cx="0" cy="0" r="28" fill="#0369a1" opacity="0.3" filter="url(#glow)" />
      <circle cx="0" cy="0" r="18" fill="url(#nodeGrad1)" class="node-pulse-1" />
      <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">INGEST</text>
    </g>

    <!-- Node 2: Vector Index & Graph -->
    <g transform="translate(240, 140)">
      <circle cx="0" cy="0" r="32" fill="#4338ca" opacity="0.3" filter="url(#glow)" />
      <circle cx="0" cy="0" r="20" fill="url(#nodeGrad2)" class="node-pulse-2" />
      <text x="0" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#818cf8" text-anchor="middle" letter-spacing="1">INDEX &amp; GRAPH</text>
    </g>

    <!-- Node 3: Hybrid Retrieval & Rerank -->
    <g transform="translate(430, 140)">
      <circle cx="0" cy="0" r="28" fill="#7e22ce" opacity="0.3" filter="url(#glow)" />
      <circle cx="0" cy="0" r="18" fill="url(#nodeGrad3)" class="node-pulse-3" />
      <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#c084fc" text-anchor="middle" letter-spacing="1">AGENT / RAG</text>
    </g>
  </g>

  <!-- Left Hero Content -->
  <g transform="translate(70, 75)">
    <!-- Pill Tag -->
    <g transform="translate(0, 0)">
      <rect width="260" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
      <circle cx="14" cy="14" r="5" fill="#38bdf8" filter="url(#glow-subtle)" />
      <text x="28" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1.5">ENTERPRISE RAG STACK</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="900" fill="url(#accentGrad)" letter-spacing="-0.5" filter="url(#glow-subtle)">
      Awesome RAG Orchestration
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#e2e8f0" letter-spacing="0.2">
      The Curated Ecosystem for Retrieval-Augmented Generation &amp; Agentic AI
    </text>

    <!-- Category Highlights Badges -->
    <g transform="translate(0, 145)">
      <g transform="translate(0, 0)">
        <rect width="130" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="65" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">⚡ RAG Pipelines</text>
      </g>
      <g transform="translate(138, 0)">
        <rect width="130" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="65" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#818cf8" text-anchor="middle">🤖 Multi-Agent AI</text>
      </g>
      <g transform="translate(276, 0)">
        <rect width="125" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="62" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#c084fc" text-anchor="middle">🕸️ GraphRAG</text>
      </g>
      <g transform="translate(409, 0)">
        <rect width="145" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="72" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#f472b6" text-anchor="middle">🛠️ Visual Builders</text>
      </g>
    </g>

    <!-- Footer Stats / Meta -->
    <text x="0" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748b">
      SaaS Platforms • Open-Source Frameworks • Document Parsers • Production Vector Retrievers
    </text>
  </g>

  <!-- Border Outline -->
  <rect width="1200" height="360" rx="16" fill="none" stroke="#334155" stroke-width="1" opacity="0.6" />
</svg>
